name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  transport-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: ["1.26.0", "1.27.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check attested transport and authorization behavior
        run: go test -short -race -count=1 ./internal/tlsct ./internal/proxy ./internal/provider ./internal/verify -run 'TestAuthorized|TestAuthorization|TestHTTP2|TestPinnedHTTP1|TestPinnedHTTPSProxy|TestGenericInference|TestPooledTransport|TestAttestedPools|TestPrepareInference|TestStandalone|TestNearHTTP2|TestWrappedClient|TestNearKeyRejection'
      - name: Check authenticated Intel collateral validity
        working-directory: third_party/go-tdx-guest
        run: go test -race ./verify
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --help

      - name: Run lint (gofmt + go vet + golangci-lint)
        run: make lint

      - name: Run tests with coverage
        run: make coverage

      - name: Run octocov
        uses: k1LoW/octocov-action@v1

      - name: Push coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          BADGE_DIR=$(mktemp -d)
          cp docs/coverage.svg "$BADGE_DIR/"
          cd "$BADGE_DIR"
          git init -b badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -m "Update coverage badge"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin badges
